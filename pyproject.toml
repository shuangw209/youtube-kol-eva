[project]
name = "youtube-kol-eva"
version = "0.1.0"
description = "YouTube KOL evaluator — 6 core metrics + comment-author authenticity + actionable verdict."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
ytkol = "ytkol.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytkol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
